x-backend-environment: &backend-environment
  CONSCIOUSNESS_DB: /data/consciousness.db
  CONSCIOUSNESS_ARTIFACT_ROOT: /data/artifacts
  CONSCIOUSNESS_EXECUTION_MODE: ${CONSCIOUSNESS_EXECUTION_MODE:-preview}
  CONSCIOUSNESS_LOOP_INTERVAL_SECONDS: ${CONSCIOUSNESS_LOOP_INTERVAL_SECONDS:-60}
  CONSCIOUSNESS_API_HOST: 0.0.0.0
  CONSCIOUSNESS_ALLOW_INSECURE_BIND: "true"
  CONSCIOUSNESS_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
  ONLY_MEMORIES_URL: ${COMPOSE_ONLY_MEMORIES_URL:-http://host.docker.internal:8765}
  ONLY_MEMORIES_WRITE_RECAPS: ${ONLY_MEMORIES_WRITE_RECAPS:-false}
  OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://host.docker.internal:11434}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  CONSCIOUSNESS_API_TOKEN: ${CONSCIOUSNESS_API_TOKEN:-}

services:
  api:
    build:
      context: ./backend
    environment: *backend-environment
    volumes:
      - consciousness-data:/data
    ports:
      - "127.0.0.1:8770:8770"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/api/v1/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker:
    build:
      context: ./backend
    command: ["consciousness-worker"]
    environment: *backend-environment
    volumes:
      - consciousness-data:/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "consciousness-worker-health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  studio:
    build:
      context: ./frontend
    environment:
      CONSCIOUSNESS_API_UPSTREAM: http://api:8770
      CONSCIOUSNESS_API_TOKEN: ${CONSCIOUSNESS_API_TOKEN:-}
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6

  experiment:
    profiles: ["experiment"]
    build:
      context: ./backend
    command: ["consciousness-memory-experiment", "run"]
    restart: "on-failure:5"
    environment:
      EXPERIMENT_ID: ${EXPERIMENT_ID:-memory-stewardship-v1}
      EXPERIMENT_DURATION_SECONDS: ${EXPERIMENT_DURATION_SECONDS:-28800}
      EXPERIMENT_BACKUP_INTERVAL_SECONDS: ${EXPERIMENT_BACKUP_INTERVAL_SECONDS:-1800}
      EXPERIMENT_SNAPSHOT_INTERVAL_SECONDS: ${EXPERIMENT_SNAPSHOT_INTERVAL_SECONDS:-900}
      EXPERIMENT_POLL_SECONDS: ${EXPERIMENT_POLL_SECONDS:-15}
      EXPERIMENT_REQUIRED_MODEL: ${EXPERIMENT_REQUIRED_MODEL:-qwen3.5:9b}
      EXPERIMENT_AGENT_INTERVAL_SECONDS: ${CONSCIOUSNESS_LOOP_INTERVAL_SECONDS:-300}
      EXPERIMENT_OUTPUT_ROOT: /experiments
      EXPERIMENT_FIXTURE_PATH: /fixtures/fixtures.json
      EXPERIMENT_CONSCIOUSNESS_DB: /source/consciousness/consciousness.db
      EXPERIMENT_ONLY_MEMORIES_DB: /source/only-memories/only-memories.sqlite3
      CONSCIOUSNESS_API_URL: http://api:8770
      ONLY_MEMORIES_URL: ${COMPOSE_ONLY_MEMORIES_URL:-http://host.docker.internal:8765}
      OLLAMA_URL: ${COMPOSE_OLLAMA_URL:-http://host.docker.internal:11434}
      CONSCIOUSNESS_API_TOKEN: ${CONSCIOUSNESS_API_TOKEN:-}
    volumes:
      - consciousness-data:/source/consciousness:ro
      - only-memories-data:/source/only-memories:ro
      - ./experiments/memory-stewardship-v1:/fixtures:ro
      - ./data/experiments:/experiments
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "consciousness-memory-experiment", "health"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 30s

volumes:
  consciousness-data:
  only-memories-data:
    external: true
    name: only-memories_only_memories_data
