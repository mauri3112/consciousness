name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
        working-directory: backend
      - run: pytest
        working-directory: backend
      - run: ruff check consciousness tests
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Operator safety browser flow
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/consciousness-studio.log 2>&1 &
          studio_pid=$!
          trap 'kill "$studio_pid"' EXIT
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:5173 >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173 >/dev/null
          npm run verify:operator

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
